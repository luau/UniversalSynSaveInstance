name: Feature Request
description: Suggest an idea for this project
title: "[FEATURE] "
labels: ["enhancement"]
assignees: ["phoriah"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please fill in the sections below.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate Check
      description: Do not skip this.
      options:
        - label: I searched existing issues (both open & closed) and this isn't a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's currently getting in the way?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about (optional).
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, links, or anything else relevant.
    validations:
      required: false
