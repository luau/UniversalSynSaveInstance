name: Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug"]
assignees: ["phoriah"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in the sections below so we can reproduce and fix the issue.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate Check
      description: Do not skip this.
      options:
        - label: I searched existing issues (both open & closed) and this isn't a duplicate.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: executor-emulator
    attributes:
      label: Executor (& Emulator if used) Name(s)
      description: "For example: Fluxus v1, Delta, Wave, etc."
    validations:
      required: true

  - type: input
    id: game-links
    attributes:
      label: Game Link(s)
      description: Always include, even if the bug happens on any game.
      placeholder: "https://www.roblox.com/games/..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "IMPORTANT: Always include a console screenshot (F9 or `/console`; also show your executor's built-in console if it has one)."
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Attached Files
      description: Upload the saved files that you're having issues with to a platform like MEGA or Google Drive and attach the link.
    validations:
      required: false

  - type: textarea
    id: script-used
    attributes:
      label: Script Used
      description: Your full script, including the options/settings you passed. Options matter.
      render: lua
      value: |
        local Params = {
            RepoURL = "https://raw.githubusercontent.com/luau/UniversalSynSaveInstance/main/",
            SSI = "saveinstance",
        }
        local synsaveinstance = loadstring(game:HttpGet(Params.RepoURL .. Params.SSI .. ".luau", true), Params.SSI)()

        local Options = {} -- Documentation here https://luau.github.io/UniversalSynSaveInstance/api/SynSaveInstance

        synsaveinstance(Options)
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: To Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: discord-tag
    attributes:
      label: My Discord Tag
      description: So we can contact you for testing if needed.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem here.
    validations:
      required: false
